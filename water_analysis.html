<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Volve Field Water Analysis</title>
    <script src="https://plot.ly"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
        h1 { color: #003366; }
        select { padding: 8px; font-size: 14px; margin-bottom: 20px; }
        .dashboard { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .card { background: white; padding: 15px; border-radius: 8px; width: 220px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        .card h3 { margin-top: 0; color: #003366; }
        #prodPlot { background: white; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body>

<h1>Volve Field Water Analysis</h1>

<label><b>Select Well:</b></label>
<select id="wellSelector"></select>

<div class="dashboard">
    <div class="card"> <h3>Well</h3> <p id="wellName">Loading...</p> </div>
    <div class="card"> <h3>Peak Water</h3> <p id="peakWater">-</p> </div>
    <div class="card"> <h3>Current Water</h3> <p id="currentWater">-</p> </div>
    <div class="card"> <h3>Cumulative Water</h3> <p id="cumWater">-</p> </div>
    <div class="card"> <h3>Current Water Cut</h3> <p id="currentWaterCut">-</p> </div>
    <div class="card"> <h3>Field Water</h3> <p id="fieldWater">-</p> </div>
</div>

<div id="prodPlot"></div>

<script>
const SM3_TO_BBL = 6.2898;
let allRows = [];

Papa.parse("volvedatacsv.csv", {
    download: true,
    header: true,
    complete: function(results) {
        allRows = results.data.filter(row => row.NPD_WELL_BORE_NAME && row.DATEPRD);
        const wells = [...new Set(allRows.map(r => r.NPD_WELL_BORE_NAME))].sort();
        const selector = document.getElementById("wellSelector");
        
        wells.forEach(well => {
            const option = document.createElement("option");
            option.value = well; option.text = well;
            selector.appendChild(option);
        });

        calculateFieldKPIs();
        selector.addEventListener("change", function() { updateWell(this.value); });
        if(wells.length > 0) updateWell(wells[0]);
    }
});

function calculateFieldKPIs(){
    const sortedDates = allRows.map(r => r.DATEPRD).filter(Boolean).sort();
    if (sortedDates.length === 0) return;
    const latestDate = sortedDates[sortedDates.length - 1];
    const latestRows = allRows.filter(r => r.DATEPRD === latestDate);

    const fieldWater = latestRows.reduce((sum, r) => sum + ((Number(r.BORE_WAT_VOL) || 0) * SM3_TO_BBL), 0);
    document.getElementById("fieldWater").innerText = fieldWater.toFixed(0) + " BWPD";
}

function updateWell(wellName){
    const wellData = allRows.filter(r => r.NPD_WELL_BORE_NAME === wellName);
    if(wellData.length === 0) return;

    const dates = wellData.map(r => r.DATEPRD);
    const water = wellData.map(r => (Number(r.BORE_WAT_VOL) || 0) * SM3_TO_BBL);
    const oil = wellData.map(r => (Number(r.BORE_OIL_VOL) || 0) * SM3_TO_BBL);

    const waterCut = wellData.map(r => {
        const w = (Number(r.BORE_WAT_VOL) || 0);
        const o = (Number(r.BORE_OIL_VOL) || 0);
        return (o + w) > 0 ? (w / (o + w)) * 100 : 0;
    });

    const totalWater = water.reduce((sum, val) => sum + val, 0);
    let maxWater = 0;
    for (let i = 0; i < water.length; i++) { if (water[i] > maxWater) maxWater = water[i]; }

    document.getElementById("wellName").innerText = wellName;
    document.getElementById("peakWater").innerText = maxWater.toFixed(0) + " BWPD";
    document.getElementById("currentWater").innerText = water[water.length - 1].toFixed(0) + " BWPD";
    document.getElementById("cumWater").innerText = (totalWater / 1000000).toFixed(2) + " MM bbls";
    document.getElementById("currentWaterCut").innerText = waterCut[waterCut.length - 1].toFixed(1) + " %";

    const waterRateTrace = { x: dates, y: water, name: "Water Rate (BWPD)", type: 'scatter', line: { color: "blue", width: 2 } };
    const waterCutTrace = { x: dates, y: waterCut, name: "Water Cut (%)", type: 'scatter', yaxis: "y2", line: { color: "lightblue", width: 2, dash: "dash" } };

    Plotly.newPlot("prodPlot", [waterRateTrace, waterCutTrace], {
        title: wellName + " Water Production Diagnostics",
        hovermode: "x unified",
        yaxis: { title: "Water Production Rate (BWPD)", titlefont: { color: "blue" }, tickfont: { color: "blue" } },
        yaxis2: { title: "Water Cut (%)", titlefont: { color: "darkblue" }, tickfont: { color: "darkblue" }, overlaying: "y", side: "right", range: [0, 100] }
    });
}
</script>
</body>
</html>
